name: Build and Release Magisk Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-update update.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          python3 -c "
          import json
          with open('module.prop') as f:
              props = dict(line.strip().split('=', 1) for line in f if '=' in line)
          data = {
              'version': props.get('version', '$TAG_NAME'),
              'versionCode': int(props.get('versionCode', 1)),
              'zipUrl': f'https://github.com/Ayoubvvch/sshserver-magisk/releases/download/$TAG_NAME/sshserver-magisk.zip',
              'changelog': 'https://raw.githubusercontent.com/Ayoubvvch/sshserver-magisk/main/changelog.md'
          }
          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --staged --quiet; then
            echo "No changes to update.json"
          else
            git commit -m "chore(release): auto-update update.json for $TAG_NAME [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Package Magisk Module ZIP
        run: |
          zip -r9 sshserver-magisk.zip . -x ".git*" ".github*" "*.zip" "README.md" "LICENSE" "update.json" "changelog.md"
          ls -la sshserver-magisk.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: sshserver-magisk.zip
          generate_release_notes: true
